{{- range $workloadKey, $workload := .Values.workloads }}
{{- if $workload.disruptionBudget }}
{{- $hasComponents := include "nebux-generic.isKeyed" (dict "root" $ "kind" "workloads") }}
---
kind: PodDisruptionBudget
apiVersion: policy/v1

metadata:
  name: "{{ include "nebux-generic.name" (dict "root" $ "kind" "workloads" "key" $workloadKey) }}"
  namespace: "{{ $.Release.Namespace }}"
  labels:
    app.kubernetes.io/instance: "{{ $.Release.Name }}"
    {{- if $hasComponents }}
    app.kubernetes.io/component: "{{ $workloadKey }}"
    {{- end }}

spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: "{{ $.Release.Name }}"
      {{- if $hasComponents }}
      app.kubernetes.io/component: "{{ $workloadKey }}"
      {{- end }}

  {{- range $key, $value := $workload.disruptionBudget }}
  {{ $key }}: {{ $value }}
  {{- end }}
{{- end }}
{{- end }}
