{{- range $ingress := .Values.ingresses }}
{{- $hasIngresses := gt (len $.Values.ingresses) 1 }}
---
kind: Ingress
apiVersion: networking.k8s.io/v1

metadata:
  name: "{{ $.Release.Name }}{{ if $hasIngresses }}-{{ $ingress.name }}{{ end }}"
  namespace: "{{ $.Release.Namespace }}"
  labels:
    app.kubernetes.io/instance: "{{ $.Release.Name }}"
  {{- if $ingress.annotations }}
  annotations: {{ toYaml $ingress.annotations | nindent 4 }}
  {{- end }}

spec:
  {{ if $ingress.className -}}
  ingressClassName: "{{ $ingress.className }}"
  {{- end }}

  rules:
    {{- range $host := $ingress.hosts }}
    - host: "{{ $host.name }}"
      http:
        paths:
          - pathType: "{{ dig "pathType" "Prefix" $host }}"
            path: "{{ $host.path }}"
            backend:
              service:
                name: "{{ include "nebux-generic.resourceName" (dict "name" (dig "service" "name" "@" $ingress) "release" $.Release.Name) }}"
                port:
                  name: "{{ dig "service" "port" "http" $ingress }}"
    {{- end }}

  tls:
    - secretName: "{{ include "nebux-generic.resourceName" (dict "name" $ingress.tlsSecretName "release" $.Release.Name) }}"
{{- end }}
