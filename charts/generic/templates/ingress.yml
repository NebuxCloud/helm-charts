{{- range $ingress := .Values.ingresses }}
---
kind: Ingress
apiVersion: networking.k8s.io/v1

metadata:
  name: "{{ include "nebux-generic.name" (dict "root" $ "kind" "ingresses" "key" $ingress.name) }}"
  namespace: "{{ $.Release.Namespace }}"
  labels:
    app.kubernetes.io/instance: "{{ $.Release.Name }}"
  {{- if $ingress.annotations }}
  annotations: {{ toYaml $ingress.annotations | nindent 4 }}
  {{- end }}

spec:
  {{ if $ingress.className -}}
  ingressClassName: "{{ $ingress.className }}"
  {{- end }}

  rules:
    {{- range $host := $ingress.hosts }}
    - host: "{{ $host.name }}"
      http:
        paths:
          - pathType: "{{ dig "pathType" "Prefix" $host }}"
            path: "{{ $host.path }}"
            backend:
              service:
                {{- $service := dig "service" "name" "@" $ingress }}
                {{- if eq $service "@" }}
                name: "{{ include "nebux-generic.defaultBackend" $ }}"
                {{- else }}
                name: "{{ include "nebux-generic.reference" (dict "root" $ "kind" "workloads" "name" $service) }}"
                {{- end }}
                port:
                  name: "{{ dig "service" "port" "http" $ingress }}"
    {{- end }}

  tls:
    - secretName: "{{ include "nebux-generic.reference" (dict "root" $ "name" $ingress.tlsSecretName) }}"
{{- end }}
