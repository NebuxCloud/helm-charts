{{- range $workloadKey, $workload := .Values.workloads }}
{{- if $workload.autoscaling }}
{{- $hasComponents := include "nebux-generic.isKeyed" (dict "root" $ "kind" "workloads") }}
{{- $isBlueGreen := hasKey (default dict $workload.strategy) "blueGreenUpdate" }}
---
kind: HorizontalPodAutoscaler
apiVersion: autoscaling/v1

metadata:
  name: "{{ include "nebux-generic.name" (dict "root" $ "kind" "workloads" "key" $workloadKey) }}"
  namespace: "{{ $.Release.Namespace }}"
  labels:
    app.kubernetes.io/instance: "{{ $.Release.Name }}"
    {{- if $hasComponents }}
    app.kubernetes.io/component: "{{ $workloadKey }}"
    {{- end }}

spec:
  scaleTargetRef:
    kind: "{{ default "Deployment" $workload.type }}"
    apiVersion: apps/v1
    name: "{{ include "nebux-generic.name" (dict "root" $ "kind" "workloads" "key" $workloadKey) }}{{ if $isBlueGreen }}-{{ $workload.strategy.blueGreenUpdate.targetSlot }}{{ end }}"

  targetCPUUtilizationPercentage: {{ $workload.autoscaling.targetCPUUtilizationPercentage }}
  
  minReplicas: {{ $workload.autoscaling.replicas.min }}
  maxReplicas: {{ $workload.autoscaling.replicas.max }}
{{- end }}
{{- end }}
