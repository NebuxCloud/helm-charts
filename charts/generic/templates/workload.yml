{{- range $workloadKey, $workload := .Values.workloads }}
{{- $workloadType := default "Deployment" $workload.type }}
{{- $isStatefulSet := eq $workloadType "StatefulSet" }}
{{- $hasComponents := include "nebux-generic.isKeyed" (dict "root" $ "kind" "workloads") }}
{{- $isBlueGreen := hasKey (default dict $workload.strategy) "blueGreenUpdate" }}
{{- if and $isBlueGreen $isStatefulSet }}
{{- fail (printf "workloads.%s: strategy.blueGreenUpdate is only supported for Deployments, not StatefulSets" $workloadKey) }}
{{- end }}
{{- if $isBlueGreen }}
{{- $bg := $workload.strategy.blueGreenUpdate }}
{{- $validSlots := tuple "blue" "green" }}
{{- if or (not (has (default "" $bg.currentSlot) $validSlots)) (not (has (default "" $bg.targetSlot) $validSlots)) }}
{{- fail (printf "workloads.%s: strategy.blueGreenUpdate.currentSlot and .targetSlot must each be \"blue\" or \"green\" (got currentSlot=%q, targetSlot=%q)" $workloadKey (default "" $bg.currentSlot) (default "" $bg.targetSlot)) }}
{{- end }}
{{- end }}
{{- range $slot := ($isBlueGreen | ternary (tuple "blue" "green") (tuple "")) }}
---
kind: "{{ $workloadType }}"
apiVersion: apps/v1

metadata:
  name: "{{ include "nebux-generic.name" (dict "root" $ "kind" "workloads" "key" $workloadKey) }}{{ if $isBlueGreen }}-{{ $slot }}{{ end }}"
  namespace: "{{ $.Release.Namespace }}"
  labels:
    app.kubernetes.io/instance: "{{ $.Release.Name }}"
    {{- if $hasComponents }}
    app.kubernetes.io/component: "{{ $workloadKey }}"
    {{- end }}
    {{- if $isBlueGreen }}
    app.kubernetes.io/slot: "{{ $slot }}"
    {{- end }}

spec:
  {{- if $isBlueGreen }}
  {{- $strategy := $workload.strategy.blueGreenUpdate }}
  {{- $isTarget := eq $strategy.targetSlot $slot }}
  {{- $isCurrent := eq $strategy.currentSlot $slot }}
  {{- $isOngoing := ne $strategy.currentSlot $strategy.targetSlot }}
  {{- if and $workload.autoscaling (or $isTarget $isCurrent) }}
  {{- else if $isCurrent }}
  {{- if kindIs "invalid" $strategy.currentReplicas }}
  {{- fail (printf "workloads.%s: strategy.blueGreenUpdate.currentReplicas is required when autoscaling is disabled" $workloadKey) }}
  {{- end }}
  replicas: {{ $strategy.currentReplicas }}
  {{- else if $isOngoing }}
  {{- if kindIs "invalid" $strategy.pastReplicas }}
  {{- fail (printf "workloads.%s: strategy.blueGreenUpdate.pastReplicas is required when autoscaling is disabled" $workloadKey) }}
  {{- end }}
  replicas: {{ $strategy.pastReplicas }}
  {{- else }}
  replicas: 0
  {{- end }}
  {{- else if $workload.replicas }}
  replicas: {{ $workload.replicas }}
  {{- end }}

  revisionHistoryLimit: {{ $workload.revisionHistoryLimit }}

  {{- if and (not $isBlueGreen) (hasKey $workload "strategy") }}
  {{ $isStatefulSet | ternary "updateStrategy" "strategy" }}: {{ toYaml $workload.strategy | nindent 4 }}
  {{- end }}

  {{- if hasKey $workload "minReadySeconds" }}
  minReadySeconds: {{ $workload.minReadySeconds }}
  {{- end }}

  {{- if $isStatefulSet }}
  {{- if hasKey $workload "ordinals" }}
  ordinals: {{ toYaml $workload.ordinals | nindent 4 }}
  {{- end }}

  {{- if hasKey $workload "serviceName" }}
  serviceName: "{{ include "nebux-generic.reference" (dict "root" $ "name" $workload.serviceName) }}"
  {{- end }}

  {{- if hasKey $workload "podManagementPolicy" }}
  podManagementPolicy: "{{ $workload.podManagementPolicy }}"
  {{- end }}

  {{- if hasKey $workload "persistentVolumeClaimRetentionPolicy" }}
  persistentVolumeClaimRetentionPolicy: {{ toYaml $workload.persistentVolumeClaimRetentionPolicy | nindent 4 }}
  {{- end }}

  {{- if hasKey $workload "volumeClaimTemplates" }}
  volumeClaimTemplates:
    {{- range $volume := $workload.volumeClaimTemplates }}
    - metadata:
        name: "{{ include "nebux-generic.reference" (dict "root" $ "name" $volume.metadata.name) }}"
      spec: {{ toYaml $volume.spec | nindent 8 }}
    {{- end }}
  {{- end }}
  {{- end }}

  selector:
    matchLabels:
      app.kubernetes.io/instance: "{{ $.Release.Name }}"
      {{- if $hasComponents }}
      app.kubernetes.io/component: "{{ $workloadKey }}"
      {{- end }}
      {{- if $isBlueGreen }}
      app.kubernetes.io/slot: "{{ $slot }}"
      {{- end }}

  template:
    metadata:
      labels:
        app.kubernetes.io/instance: "{{ $.Release.Name }}"
        {{- if $hasComponents }}
        app.kubernetes.io/component: "{{ $workloadKey }}"
        {{- end }}
        {{- if $isBlueGreen }}
        app.kubernetes.io/slot: "{{ $slot }}"
        {{- end }}
      annotations:
        configmaps-hash: "{{ $.Values.configMaps | toYaml | sha256sum | trunc 8 }}"
        secrets-hash: "{{ $.Values.secrets | toYaml | sha256sum | trunc 8 }}"

    spec:
      {{- if hasKey $workload "tolerations" }}
      tolerations: {{ toYaml $workload.tolerations | nindent 8 }}
      {{- end }}

      {{- if hasKey $workload "nodeSelector" }}
      nodeSelector: {{ toYaml $workload.nodeSelector | nindent 8 }}
      {{- end }}

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: In
                      values:
                        - "{{ $.Release.Name }}"
                    {{- if $hasComponents }}
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - "{{ $workloadKey }}"
                    {{- end }}
                    {{- if $isBlueGreen }}
                    - key: app.kubernetes.io/slot
                      operator: In
                      values:
                        - "{{ $slot }}"
                    {{- end }}

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: "{{ $.Release.Name }}"
              {{- if $hasComponents }}
              app.kubernetes.io/component: "{{ $workloadKey }}"
              {{- end }}
              {{- if $isBlueGreen }}
              app.kubernetes.io/slot: "{{ $slot }}"
              {{- end }}

      {{- if hasKey $workload "restartPolicy" }}
      restartPolicy: {{ toYaml $workload.restartPolicy | nindent 8 }}
      {{- end }}

      {{- if hasKey $workload "enableServiceLinks" }}
      enableServiceLinks: {{ toYaml $workload.enableServiceLinks | nindent 8 }}
      {{- end }}

      {{- if hasKey $workload "imagePullSecrets" }}
      imagePullSecrets:
        {{- range $pullSecret := $workload.imagePullSecrets }}
        - name: "{{ include "nebux-generic.reference" (dict "root" $ "name" $pullSecret.name) }}"
        {{- end }}
      {{- end }}

      {{- if hasKey $workload "volumes" }}
      volumes:
        {{- include "nebux-generic.volumes" (dict "root" $ "volumes" $workload.volumes) | trim | nindent 8 }}
      {{- end }}

      {{- if hasKey $workload "securityContext" }}
      securityContext: {{ toYaml $workload.securityContext | nindent 8 }}
      {{- end }}

      {{- if hasKey $workload "automountServiceAccountToken" }}
      automountServiceAccountToken: {{ $workload.automountServiceAccountToken }}
      {{- end }}

      {{- if hasKey $workload "serviceAccountName" }}
      serviceAccountName: "{{ include "nebux-generic.reference" (dict "root" $ "name" $workload.serviceAccountName) }}"
      {{- end }}

      {{- range $containerType := tuple "initContainers" "containers" }}
      {{- if hasKey $workload $containerType }}
      {{ $containerType }}:
        {{- range $containerName, $container := index $workload $containerType }}
        - name: "{{ $containerName }}"

          {{- $hasSlottedImage := kindIs "map" $container.image }}
          {{- if not $hasSlottedImage }}
          image: "{{ $container.image }}"
          {{- else }}
          image: "{{ index $container "image" $slot }}"
          {{- end }}

          {{- if hasKey $container "imagePullPolicy" }}
          imagePullPolicy: {{ toYaml $container.imagePullPolicy | nindent 12 }}
          {{- end }}

          {{- if hasKey $container "command" }}
          command: {{ toYaml $container.command | nindent 12 }}
          {{- end }}

          {{- if hasKey $container "args" }}
          args: {{ toYaml $container.args | nindent 12 }}
          {{- end }}

          {{- if hasKey $container "restartPolicy" }}
          restartPolicy: {{ toYaml $container.restartPolicy | nindent 12 }}
          {{- end }}

          {{- if hasKey $container "lifecycle" }}
          lifecycle: {{ toYaml $container.lifecycle | nindent 12 }}
          {{- end }}

          {{- if hasKey $container "envFrom" }}
          envFrom:
            {{- range $configMap := $container.envFrom.configMaps }}
            - configMapRef:
                name: "{{ include "nebux-generic.reference" (dict "root" $ "kind" "configMaps" "name" $configMap) }}"
            {{- end }}
            {{- range $secret := $container.envFrom.secrets }}
            - secretRef:
                name: "{{ include "nebux-generic.reference" (dict "root" $ "kind" "secrets" "name" $secret) }}"
            {{- end }}
          {{- end }}

          {{- if hasKey $container "env" }}
          {{- $envs := list }}
          {{- range $env := $container.env }}
          {{- if hasKey (default dict $env.valueFrom) "secretKeyRef" }}
          {{- $name := include "nebux-generic.reference" (dict "root" $ "kind" "secrets" "name" $env.valueFrom.secretKeyRef.name) }}
          {{- $env = mergeOverwrite (deepCopy $env) (dict "valueFrom" (dict "secretKeyRef" (dict "name" $name))) }}
          {{- else if hasKey (default dict $env.valueFrom) "configMapKeyRef" }}
          {{- $name := include "nebux-generic.reference" (dict "root" $ "kind" "configMaps" "name" $env.valueFrom.configMapKeyRef.name) }}
          {{- $env = mergeOverwrite (deepCopy $env) (dict "valueFrom" (dict "configMapKeyRef" (dict "name" $name))) }}
          {{- end }}
          {{- $envs = append $envs $env }}
          {{- end }}
          env: {{ toYaml $envs | nindent 12 }}
          {{- end }}

          {{- if hasKey $container "volumeMounts" }}
          volumeMounts: {{ toYaml $container.volumeMounts | nindent 12 }}
          {{- end }}

          {{- if hasKey $container "resources" }}
          resources: {{ toYaml $container.resources | nindent 12 }}
          {{- end }}

          {{- if hasKey $container "ports" }}
          ports: {{ toYaml $container.ports | nindent 12 }}
          {{- end }}

          {{- range $probeType, $probeConfig := $container.probes }}
          {{ $probeType }}Probe: {{ toYaml $probeConfig | nindent 12 }}
          {{- end }}

          {{- if hasKey $container "securityContext" }}
          securityContext: {{ toYaml $container.securityContext | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- end }}
{{- end }}
{{- end }}
